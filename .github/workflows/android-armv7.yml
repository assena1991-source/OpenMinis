name: Android ARMv7 build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/android-32bit-armv7]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm32-and-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout with native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.0.12433566"

      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init

      - name: Prepare optional build configuration
        run: |
          if [ -f src/android/app/provider-customization.properties.example ] && [ ! -f src/android/app/provider-customization.properties ]; then
            cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties
          fi

      - name: Build PRoot for ARM64
        run: ./deps/build_proot.sh clean

      - name: Build PRoot for ARMv7
        env:
          OPENMINIS_ANDROID_ABI: armeabi-v7a
        run: ./deps/build_proot.sh clean

      - name: Prepare both Alpine root filesystems
        run: |
          ./scripts/prepare_android_sandbox.sh
          OPENMINIS_ANDROID_ABI=armeabi-v7a ./scripts/prepare_android_sandbox.sh

      - name: Build combined ARM and ARM64 rclone AAR
        run: ./deps/build_rclone_android.sh

      - name: Run unit tests and build APK
        working-directory: src/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK contains both ABIs and sandbox assets
        working-directory: src/android
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          listing="$(unzip -Z1 "$apk")"
          for abi in arm64-v8a armeabi-v7a; do
            grep -Fx "lib/$abi/libproot.so" <<< "$listing"
            grep -Fx "lib/$abi/libproot-loader.so" <<< "$listing"
          done
          grep -Fx "assets/proot-aarch64" <<< "$listing"
          grep -Fx "assets/proot-armv7" <<< "$listing"
          grep -Fx "assets/alpine-minirootfs.tar.gz" <<< "$listing"
          grep -Fx "assets/alpine-minirootfs-armv7.tar.gz" <<< "$listing"
          grep -E '^lib/(arm64-v8a|armeabi-v7a)/libRealtimeCutVadLibrary.so$' <<< "$listing"
