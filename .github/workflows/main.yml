
name: OpenMinis Android Build Test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "OpenMinis source downloaded"
          ls -la
          echo "Build instructions:"
          test -f BUILDING.md && cat BUILDING.md || true
